<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#f8fafc"/>
  
  <!-- Envelope Body -->
  <rect x="100" y="150" width="300" height="200" rx="20" fill="#3b82f6"/>
  
  <!-- Envelope Flap -->
  <path d="M100 170 L250 280 L400 170" fill="#2563eb"/>
  
  <!-- Envelope Fold Lines -->
  <path d="M100 170 L250 280 L400 170" stroke="#1d4ed8" stroke-width="3" fill="none"/>
  <path d="M100 350 L180 250" stroke="#1d4ed8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M400 350 L320 250" stroke="#1d4ed8" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Exchange Arrows -->
  <g transform="translate(350, 100)">
    <path d="M10 30 L30 10 L30 20 L50 20 L50 40 L30 40 L30 50 Z" fill="#10b981"/>
    <path d="M50 10 L30 30 L30 20 L10 20 L10 0 L30 0 L30 -10 Z" fill="#ef4444" transform="rotate(180 30 20)"/>
  </g>
  
  <!-- Decorative Dots -->
  <circle cx="130" cy="320" r="8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="155" cy="320" r="8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="180" cy="320" r="8" fill="#60a5fa" opacity="0.6"/>
</svg>