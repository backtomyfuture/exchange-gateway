# 生产环境配置
# 使用方法：docker-compose up -d
#
# 首次部署请先运行：sudo ./scripts/setup-secrets.sh

services:
  # ===========================================
  # MySQL 数据库
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: exchange-gateway-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
      - --innodb_buffer_pool_size=256M
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vue_fastapi_admin}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$(cat /run/secrets/mysql_root_password)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================
  # FastAPI 应用
  # ===========================================
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-app
    restart: always
    environment:
      - DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=${DB_NAME:-vue_fastapi_admin}
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - WORKERS=${WORKERS:-4}
      # Exchange 邮件服务配置
      - EXCHANGE_SERVER=${EXCHANGE_SERVER:-10.72.8.110}
      - EXCHANGE_DOMAIN=${EXCHANGE_DOMAIN:-hnanet}
      - EXCHANGE_EMAIL_SUFFIX=${EXCHANGE_EMAIL_SUFFIX:-@tianjin-air.com}
      - EXCHANGE_EMAIL_SUFFIX=${EXCHANGE_EMAIL_SUFFIX:-@tianjin-air.com}
      - EXCHANGE_ENCRYPTION_KEY_FILE=/run/secrets/exchange_encryption_key
      # Webhook 安全配置
      - WEBHOOK_ALLOW_PRIVATE_URLS=${WEBHOOK_ALLOW_PRIVATE_URLS:-false}
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json').read()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - db_password
      - secret_key
      - exchange_encryption_key
    volumes:
      - app_logs:/opt/app/app/logs
      - ./app:/opt/app/app
      - ./migrations:/opt/app/migrations
      - ./pyproject.toml:/opt/app/pyproject.toml
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M


  # ===========================================
  # Webhook 监听 Worker
  # ===========================================
  webhook-worker:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-webhook-worker
    restart: always
    entrypoint: [ "python3", "-m", "app.services.exchange.webhook_listener" ]
    environment:
      - DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=${DB_NAME:-vue_fastapi_admin}
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - EXCHANGE_ENCRYPTION_KEY_FILE=/run/secrets/exchange_encryption_key
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    secrets:
      - db_password
      - secret_key
      - exchange_encryption_key
    volumes:
      - app_logs:/opt/app/app/logs
      - ./app:/opt/app/app
      - ./migrations:/opt/app/migrations
      - ./pyproject.toml:/opt/app/pyproject.toml
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================
  # Nginx 反向代理 + 静态文件服务
  # ===========================================
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: exchange-gateway-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80" # HTTP (重定向到 HTTPS)
      - "${NGINX_SSL_PORT:-443}:443" # HTTPS
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# ===========================================
# Secrets（生产环境存储在系统目录）
# ===========================================
secrets:
  mysql_root_password:
    file: /etc/exchange/secrets/mysql_root_password
  mysql_password:
    file: /etc/exchange/secrets/mysql_password
  db_password:
    file: /etc/exchange/secrets/db_password
  secret_key:
    file: /etc/exchange/secrets/secret_key
  exchange_encryption_key:
    file: /etc/exchange/secrets/exchange_encryption_key

# ===========================================
# 网络
# ===========================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# ===========================================
# 数据卷
# ===========================================
volumes:
  mysql_data:
  app_logs:
