# Exchange Gateway - Docker Compose
#
# Quick Start:
#   ./scripts/init-secrets.sh          # first time only
#   cp .env.example .env               # edit as needed
#   docker compose up -d
#
# External Database / Redis:
#   To use an existing MySQL or Redis instance, comment out the
#   corresponding service below and set DB_HOST / REDIS_URL in .env.
#
# Secrets:
#   .env has ZERO secrets — all passwords/keys live in ./secrets/.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-app-secrets: &app-secrets
  - secret_key
  - exchange_encryption_key
  - db_password

x-app-env: &app-env
  ENV: ${ENV:-dev}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-exchange_gateway}
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD_FILE: /run/secrets/db_password
  SECRET_KEY_FILE: /run/secrets/secret_key
  EXCHANGE_ENCRYPTION_KEY_FILE: /run/secrets/exchange_encryption_key
  EXCHANGE_SERVER: ${EXCHANGE_SERVER:-}
  EXCHANGE_DOMAIN: ${EXCHANGE_DOMAIN:-}
  EXCHANGE_EMAIL_SUFFIX: ${EXCHANGE_EMAIL_SUFFIX:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  WEBHOOK_ALLOW_PRIVATE_URLS: "true"
  LOGS_ROOT: /var/log/app

secrets:
  secret_key:
    file: ./secrets/secret_key
  exchange_encryption_key:
    file: ./secrets/exchange_encryption_key
  db_password:
    file: ./secrets/db_password

services:
  # ── MySQL ────────────────────────────────────────────────────────────
  # Remove this service if using an external database.
  # Set DB_HOST, DB_PORT, DB_USER in .env; put password in secrets/db_password.
  mysql:
    image: mysql:8.0
    container_name: exchange-gateway-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: ${DB_NAME:-exchange_gateway}
    secrets:
      - db_password
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ── Redis ────────────────────────────────────────────────────────────
  # Remove this service if using an external Redis.
  # Set REDIS_URL in .env (e.g. redis://your-redis:6379/0).
  redis:
    image: redis:7-alpine
    container_name: exchange-gateway-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    logging: *default-logging

  # ── FastAPI Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-app
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: ${BACKEND_PORT:-8000}
      WORKERS: ${WORKERS:-2}
    secrets: *app-secrets
    ports:
      - "${API_PORT:-18001}:${BACKEND_PORT:-8000}"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    volumes:
      - ./app:/opt/app/app:ro
      - ./.docker-data/logs:/var/log/app
      - ./pyproject.toml:/opt/app/pyproject.toml:ro
      - ./migrations:/opt/app/migrations
      - ./tests:/opt/app/tests:ro
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    logging: *default-logging

  # ── Webhook Listener Worker ──────────────────────────────────────────
  webhook-worker:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-webhook-worker
    restart: unless-stopped
    entrypoint: ["/opt/app/entrypoint-worker.sh"]
    environment:
      <<: *app-env
      PORT: ${BACKEND_PORT:-8000}
    secrets: *app-secrets
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      app:
        condition: service_started
    volumes:
      - ./app:/opt/app/app:ro
      - ./migrations:/opt/app/migrations
      - ./.docker-data/logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import time; t=float(open('/tmp/worker_heartbeat').read()); assert time.time()-t<60\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging: *default-logging

  # ── ARQ Task Queue Worker ────────────────────────────────────────────
  arq-worker:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-arq-worker
    restart: unless-stopped
    entrypoint: ["/opt/app/entrypoint-arq.sh"]
    command: []
    environment:
      <<: *app-env
    secrets: *app-secrets
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    volumes:
      - ./app:/opt/app/app:ro
      - ./.docker-data/logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import time; t=float(open('/tmp/worker_heartbeat').read()); assert time.time()-t<60\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging: *default-logging

  # ── Nginx (Reverse Proxy + Vue SPA) ─────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        NGINX_ENV: ${ENV:-dev}
    container_name: exchange-gateway-nginx
    restart: unless-stopped
    environment:
      NGINX_ENV: ${ENV:-dev}
      BACKEND_HOST: app
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${NGINX_PORT:-80}:8080"
    depends_on:
      app:
        condition: service_started
    networks:
      - frontend
    logging: *default-logging

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
