# Exchange Gateway - Docker Compose Configuration
# 
# Quick Start:
#   cp .env.example .env
#   # Edit .env: set EXCHANGE_SERVER, EXCHANGE_DOMAIN, EXCHANGE_EMAIL_SUFFIX
#   docker compose up -d
#
# ENV=dev (default): 零配置开发模式, HTTP, 自动生成密钥
# ENV=prod: 生产模式, 需要配置安全密钥和 SSL 证书

services:
  # ===========================================
  # MySQL Database
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: exchange-gateway-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-exchange_gateway}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "13306:3306"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ===========================================
  # FastAPI Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-app
    restart: unless-stopped
    environment:
      - ENV=${ENV:-dev}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - DB_NAME=${DB_NAME:-exchange_gateway}
      - SECRET_KEY=${SECRET_KEY}
      - WORKERS=${WORKERS:-2}
      # Exchange mail service configuration (no defaults - must be configured)
      - EXCHANGE_SERVER=${EXCHANGE_SERVER}
      - EXCHANGE_DOMAIN=${EXCHANGE_DOMAIN}
      - EXCHANGE_EMAIL_SUFFIX=${EXCHANGE_EMAIL_SUFFIX}
      - EXCHANGE_ENCRYPTION_KEY=${EXCHANGE_ENCRYPTION_KEY}
      - WEBHOOK_ALLOW_PRIVATE_URLS=true
    ports:
      - "18001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/opt/app/app:ro
      - ./.docker-data/logs:/var/log/app
      - ./pyproject.toml:/opt/app/pyproject.toml:ro
      - ./migrations:/opt/app/migrations
      - ./tests:/opt/app/tests:ro
      - ./pytest.ini:/opt/app/pytest.ini:ro
    networks:
      - backend
      - frontend

  # ===========================================
  # Webhook Listener Worker
  # ===========================================
  webhook-worker:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    image: exchange-app:latest
    container_name: exchange-gateway-webhook-worker
    restart: unless-stopped
    entrypoint: ["/opt/app/entrypoint-worker.sh"]
    environment:
      - ENV=${ENV:-dev}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - DB_NAME=${DB_NAME:-exchange_gateway}
      - SECRET_KEY=${SECRET_KEY}
      - EXCHANGE_ENCRYPTION_KEY=${EXCHANGE_ENCRYPTION_KEY}
      - WEBHOOK_ALLOW_PRIVATE_URLS=true
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./app:/opt/app/app:ro
      - ./migrations:/opt/app/migrations
      - ./.docker-data/logs:/var/log/app
    networks:
      - backend

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        NGINX_ENV: ${ENV:-dev}
    container_name: exchange-gateway-nginx
    restart: unless-stopped
    environment:
      - NGINX_ENV=${ENV:-dev}
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      app:
        condition: service_started
    networks:
      - frontend

# ===========================================
# Networks
# ===========================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
